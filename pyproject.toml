[project]
name = "transcriber-radrx"
version = "0.1.0"
description = "Local radiotherapy clinical transcription with vocabulary-biased ASR"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "The Kindled", email = "stuart@sjstargetedsolutions.co.nz"},
]
dependencies = [
    "mlx-whisper>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-json-report>=1.5",
    "pre-commit>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
]
phonetic = [
    "metaphone>=0.6",
]
audio = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyroomacoustics>=0.7",
]
validation = [
    "jiwer>=4.0",
]

[project.scripts]
transcribe-radrx = "transcriber_radrx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber_radrx"]

[tool.ruff]
line-length = 127
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B", "A", "C4", "SIM", "TRY", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "validation: end-to-end validation tests requiring corpora and audio (slow)",
    "requires_corpora: test needs acquired corpus data",
    "requires_audio: test needs generated synthetic audio",
]
# Default test run excludes validation suite
addopts = "-m 'not validation'"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["mlx_whisper", "metaphone", "pyroomacoustics", "scipy.signal"]
ignore_missing_imports = true
