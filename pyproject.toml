[project]
name = "transcriber-radrx"
version = "0.1.0"
description = "Local radiotherapy clinical transcription with vocabulary-biased ASR"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "The Kindled", email = "stuart@sjstargetedsolutions.co.nz"},
]
dependencies = [
    "loguru>=0.7.3",
    # mlx-whisper is currently a hard dependency because it is the baseline
    # ASR backend and most users will want it. A future PR may move this
    # into an `asr-whisper-mlx` extra once the backend registry is the
    # primary entry point.
    "mlx-whisper>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-json-report>=1.5",
    "pre-commit>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "jiwer>=4.0",
    "docx-revisions>=0.1",
]
phonetic = [
    "metaphone>=0.6",
]
audio = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyroomacoustics>=0.7",
]
validation = [
    "jiwer>=4.0",
]
# Google MedASR backend. The ainergiz/medasr-mlx inference code is vendored
# under src/transcriber_radrx/asr_backends/_medasr_mlx_lib/ (see VENDOR.md).
# Beam-search decoding requires kenlm which is a C extension; if the install
# fails on your platform, use decode_mode="greedy" which skips kenlm.
asr-medasr = [
    "numpy>=1.24",
    "scipy>=1.11",
    "soundfile>=0.12",
    "transformers>=4.46",
    "huggingface-hub>=0.25",
    "pyctcdecode>=0.5",
    "kenlm>=0.3",
]
# Cohere Transcribe backend. Native transformers >=5.4 is required
# because that is the version where CohereAsrForConditionalGeneration
# was registered as a first-class model class. Torch is needed for
# inference; MPS support requires torch>=2.2 on Apple Silicon.
asr-cohere = [
    "numpy>=1.24",
    "scipy>=1.11",
    "soundfile>=0.12",
    "transformers>=5.4",
    "torch>=2.2",
    "huggingface-hub>=0.25",
    # Cohere's feature extractor imports librosa for mel-spectrogram
    # preprocessing. This is required at processor load time, not just
    # at inference time, so we must install it eagerly.
    "librosa>=0.10",
    # Required by transformers when using device_map="auto" for
    # placement across MPS/CUDA/CPU.
    "accelerate>=1.0",
]
# IBM Granite-Speech backend. Speech-LLM (instruction-following audio
# model): Conformer-style audio encoder bolted onto the Granite LLM
# decoder, used via AutoProcessor + AutoModelForSpeechSeq2Seq with a
# chat-template system prompt. peft is required because the audio
# adapter ships as a PEFT adapter layer on top of the base Granite.
# torchaudio is used by the processor for audio loading.
asr-granite = [
    "numpy>=1.24",
    "scipy>=1.11",
    "soundfile>=0.12",
    "transformers>=4.52",
    "torch>=2.2",
    "peft>=0.13",
    "accelerate>=1.0",
    "huggingface-hub>=0.25",
]
# Mistral Voxtral backend (audio-LLM). Uses VoxtralForConditionalGeneration
# registered in transformers>=5.2. This is the instruction-following
# variant (Mini 3B / Small 24B) for the RT dictation track, NOT the
# streaming ASR-only Voxtral Mini 4B Realtime variant (which needs vLLM
# or a community MLX port).
asr-voxtral = [
    "numpy>=1.24",
    "scipy>=1.11",
    "soundfile>=0.12",
    "transformers>=5.2",
    "torch>=2.2",
    "torchaudio>=2.2",
    "accelerate>=1.0",
    "huggingface-hub>=0.25",
    # Voxtral uses mistral-common for its audio-aware tokenization in
    # some code paths (notably the apply_transcription_request path).
    "mistral-common>=1.5",
    "librosa>=0.10",
]

[project.scripts]
transcribe-radrx = "transcriber_radrx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber_radrx"]

[tool.ruff]
line-length = 127
target-version = "py311"
# Vendored third-party code — not our style. See VENDOR.md.
# force-exclude is required so pre-commit's explicit file list still
# honors the exclude (otherwise extend-exclude only affects traversal).
extend-exclude = [
    "src/transcriber_radrx/asr_backends/_medasr_mlx_lib",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B", "A", "C4", "SIM", "TRY", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Fixture generators contain literal clinical sentences that cannot be
# meaningfully wrapped — they are realistic dictation patterns.
"tests/validation/scripts/generate_dense_clinical.py" = ["E501"]
"tests/validation/scripts/generate_homograph_traps.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "validation: end-to-end validation tests requiring corpora and audio (slow)",
    "requires_corpora: test needs acquired corpus data",
    "requires_audio: test needs generated synthetic audio",
]
# Default test run excludes validation suite
addopts = "-m 'not validation'"

[tool.mypy]
python_version = "3.11"
strict = true
# Vendored third-party code — exclude from type checking. Re-enable if
# we ever fork or modify it in place (which we do not).
exclude = [
    "src/transcriber_radrx/asr_backends/_medasr_mlx_lib/",
]

[[tool.mypy.overrides]]
module = [
    "mlx_whisper",
    "metaphone",
    "pyroomacoustics",
    "scipy.signal",
    "mlx",
    "mlx.core",
    "mlx.nn",
    "huggingface_hub",
    "pyctcdecode",
    "kenlm",
    "soundfile",
    "transformers",
    "torchaudio",
    "peft",
    "librosa",
    "accelerate",
    "transcriber_radrx.asr_backends._medasr_mlx_lib.*",
]
ignore_missing_imports = true

# Vivian's audio_synthesis code predates the numpy 1.26 pin from asr-medasr
# and uses bare `np.ndarray` annotations. New mypy versions + new numpy
# stubs flag these as "missing type arguments". Not my code to refactor —
# disabling the warning here keeps CI green without touching her modules.
[[tool.mypy.overrides]]
module = "tests.validation.audio_synthesis.*"
disable_error_code = ["type-arg"]

# medasr.py uses `# type: ignore[no-untyped-call]` on transformers'
# AutoProcessor.from_pretrained calls. That ignore is needed when the
# asr-medasr extras are installed (transformers ships typed stubs where
# from_pretrained is untyped-in-typed-context). When asr-medasr is NOT
# installed — which is the CI default, to avoid pulling transformers/
# torch/kenlm into lint jobs — transformers becomes Any via
# ignore_missing_imports and the ignore is "unused". We cannot satisfy
# both environments with a static comment, so we disable the
# warn_unused_ignores warning for this one module. Strict mode still
# applies everywhere else.
[[tool.mypy.overrides]]
module = "transcriber_radrx.asr_backends.medasr"
warn_unused_ignores = false

# cohere.py has the same dual-environment problem as medasr.py:
# `# type: ignore[no-untyped-call]` on AutoProcessor.from_pretrained and
# `# type: ignore[attr-defined]` on torch.backends.mps / torch.mps are
# needed when the asr-cohere extras are installed (typed stubs present)
# but become "unused" in CI where the extras are NOT installed and
# transformers/torch are Any via ignore_missing_imports. Same fix:
# disable warn_unused_ignores for just this module.
[[tool.mypy.overrides]]
module = "transcriber_radrx.asr_backends.cohere"
warn_unused_ignores = false

# granite.py: same dual-environment type: ignore pattern as medasr
# and cohere. CI does not install asr-granite extras, so transformers
# and torch resolve to Any via ignore_missing_imports and the ignore
# comments become "unused". Disable warn_unused_ignores for this
# module specifically.
[[tool.mypy.overrides]]
module = "transcriber_radrx.asr_backends.granite"
warn_unused_ignores = false

# voxtral.py: same dual-environment type: ignore pattern as the other
# audio-LLM backends. CI does not install asr-voxtral extras.
[[tool.mypy.overrides]]
module = "transcriber_radrx.asr_backends.voxtral"
warn_unused_ignores = false
