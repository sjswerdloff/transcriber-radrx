---
name: Build Windows Executable

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.2.0)"
        required: false
        default: "dev"

jobs:
  build:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies (GUI + dev, no ASR backends)
        run: uv sync --extra dev --extra gui --extra phonetic --extra validation

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable
        run: uv run pyinstaller scripts/transcriber_radrx.spec --noconfirm
        shell: bash

      - name: Verify executable exists
        run: |
          if [ -f "dist/transcriber-radrx/transcriber-radrx.exe" ]; then
            echo "Build successful"
            ls -lh dist/transcriber-radrx/transcriber-radrx.exe
          else
            echo "Build failed — executable not found"
            ls -R dist/ || true
            exit 1
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-radrx-windows-${{ github.event.inputs.version }}
          path: dist/transcriber-radrx/
          retention-days: 90
