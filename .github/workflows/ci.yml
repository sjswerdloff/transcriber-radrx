---
name: CI Pipeline

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Check lock file is in sync
        run: |
          if ! uv lock --check; then
            echo "::error::uv.lock is out of sync with pyproject.toml. Run 'uv lock' locally and commit."
            exit 1
          fi

      - name: Install dependencies (lint extras only)
        run: uv sync --extra dev

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        # phonetic and audio are needed so mypy can resolve imports in
        # modules that conditionally use them. validation extra is not
        # needed here; jiwer is already in dev.
        # Heavy ASR extras (asr-voxtral, asr-granite, asr-cohere,
        # asr-medasr) are intentionally excluded — they pull torch/
        # transformers/kenlm (multi-GB). Backend modules use
        # warn_unused_ignores=false overrides in pyproject.toml so mypy
        # stays clean regardless of whether those extras are installed.
        run: uv sync --extra dev --extra phonetic --extra audio

      - name: Type check with mypy
        run: uv run mypy src/ tests/validation/audio_synthesis

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        # validation extra adds jiwer for ensemble/WER tests.
        # Heavy ASR extras (asr-voxtral, asr-granite, asr-cohere,
        # asr-medasr) are intentionally excluded — torch/transformers/
        # kenlm are multi-GB and tests skip backends that aren't installed.
        run: uv sync --extra dev --extra phonetic --extra audio --extra validation

      - name: Run tests
        run: uv run pytest tests/ --json-report --json-report-file=results.json -q

      - name: Display test summary
        if: always()
        run: |
          if [ -f results.json ]; then
            echo "Test Results:"
            python3 -c "
          import json, sys
          data = json.load(open('results.json'))
          s = data.get('summary', {})
          print(f\"passed: {s.get('passed', 0)}  skipped: {s.get('skipped', 0)}  failed: {s.get('failed', 0)}\")
          sys.exit(1 if s.get('failed', 0) > 0 else 0)
          "
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: results.json
          retention-days: 14
